<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI in the Market — What's Happening Now, and How Markets Reprice — June 2026</title>
<meta name="description" content="AI in the Market: agentic loops, token rationing, and Washington's entry — then the repricing: equities, labor, and the AI bond wave. June 2026.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a0a; color: #fff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; transition: right 0.2s ease; }
  body.notes-open .stage { right: 320px; }
  .viewer { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .slide {
    max-width: 100%; max-height: 100vh; width: auto; height: auto;
    object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    user-select: none; -webkit-user-drag: none;
  }
  .chrome { position: fixed; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; pointer-events: none; z-index: 10; transition: right 0.2s ease; }
  body.notes-open .chrome { right: 320px; }
  .chrome.top { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); }
  .chrome.bottom { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), transparent); }
  .chrome > * { pointer-events: auto; }
  .title { font-size: 13px; font-weight: bold; letter-spacing: 0.03em; color: #fff; }
  .title span { color: #F6693D; }
  .topbtns { display: flex; gap: 8px; align-items: center; }
  .download, .ghost {
    padding: 8px 14px; border-radius: 4px; text-decoration: none;
    font-size: 11px; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase;
    transition: transform 0.15s; cursor: pointer; border: none; line-height: 1;
  }
  .download { background: #F6693D; color: #000; }
  .ghost { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
  .download:hover, .ghost:hover { transform: translateY(-1px); }
  .ghost:hover { background: rgba(255,255,255,0.2); }
  .controls {
    display: flex; gap: 8px; align-items: center;
    background: rgba(20,20,20,0.85); padding: 8px 12px; border-radius: 999px;
    font-size: 12px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08);
  }
  .controls button {
    background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0; transition: all 0.15s;
  }
  .controls button:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); }
  .controls button:disabled { opacity: 0.3; cursor: default; }
  .counter { min-width: 56px; text-align: center; color: #fff; font-variant-numeric: tabular-nums; cursor: pointer; border-radius: 4px; padding: 4px 2px; }
  .counter:hover { background: rgba(255,255,255,0.1); }
  .counter b { color: #F6693D; font-weight: bold; }
  .hint { font-size: 10px; color: #fff; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }

  /* Jump-to grid overlay */
  .grid-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 50;
    display: none; overflow-y: auto; padding: 56px 32px 32px;
  }
  .grid-overlay.open { display: block; }
  .grid-overlay h2 { font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 18px; }
  .grid-overlay .closex { position: fixed; top: 16px; right: 24px; font-size: 26px; color: #fff; background: none; border: none; cursor: pointer; }
  .section-label { font-size: 11px; font-weight: bold; letter-spacing: 0.12em; text-transform: uppercase; color: #F6693D; margin: 18px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .thumb { cursor: pointer; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: #161616; transition: border-color 0.15s, transform 0.15s; }
  .thumb:hover { border-color: #F6693D; transform: translateY(-2px); }
  .thumb.current { border-color: #FFB800; }
  .thumb img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
  .thumb .cap { padding: 6px 8px; font-size: 10.5px; color: #ccc; line-height: 1.35; }
  .thumb .cap b { color: #fff; }

  /* Presenter notes panel */
  .notes {
    position: fixed; top: 0; right: -320px; bottom: 0; width: 320px;
    background: #141414; border-left: 1px solid rgba(255,255,255,0.1);
    z-index: 40; padding: 20px; overflow-y: auto; transition: right 0.2s ease;
  }
  body.notes-open .notes { right: 0; }
  .notes h3 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #F6693D; margin-bottom: 6px; }
  .notes .slide-title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 14px; line-height: 1.4; }
  .notes .body { font-size: 13px; line-height: 1.65; color: #ccc; white-space: pre-wrap; }
  .notes .next { margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); }
  .notes .next .lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #777; margin-bottom: 6px; }
  .notes .next img { width: 100%; border-radius: 4px; opacity: 0.85; }

  @media (max-width: 760px) {
    .hint, .title { display: none; }
    body.notes-open .stage, body.notes-open .chrome { right: 0; }
    .notes { width: 85vw; }
  }
</style>
</head>
<body>
  <div class="stage"><div class="viewer">
    <img id="slide" class="slide" alt="Slide" draggable="false" />
  </div></div>

  <div class="chrome top">
    <div class="title" id="deckTitle">AI in the Market <span>— June 2026</span></div>
    <div class="topbtns">
      <button class="ghost" id="gridBtn" title="Jump to slide (G)">Slides</button>
      <button class="ghost" id="notesBtn" title="Presenter notes (N)">Notes</button>
      <a class="download" id="dl" href="./ai-markets-deck.pptx" download>Download .pptx</a>
    </div>
  </div>

  <div class="chrome bottom">
    <div class="hint">← → arrows · G grid · N notes</div>
    <div class="controls">
      <button id="prev" aria-label="Previous slide">‹</button>
      <span class="counter" id="counter" title="Jump to slide"><b id="cur">1</b> / <span id="total">–</span></span>
      <button id="next" aria-label="Next slide">›</button>
    </div>
    <div class="hint" style="visibility:hidden;">spacer</div>
  </div>

  <div class="grid-overlay" id="gridOverlay">
    <button class="closex" id="gridClose" aria-label="Close">×</button>
    <h2>Jump to slide</h2>
    <div id="gridBody"></div>
  </div>

  <aside class="notes" id="notesPanel">
    <h3 id="notesNum">Slide 1</h3>
    <div class="slide-title" id="notesTitle"></div>
    <div class="body" id="notesBody"></div>
    <div class="next">
      <div class="lbl">Next slide</div>
      <img id="nextThumb" alt="Next slide preview" />
    </div>
  </aside>

  <script src="./slides-data.js"></script>
  <script>
    const D = window.DECK || { title: "Deck", subtitle: "", total: 12, titles: [], notes: [], sections: [], file: "ai-markets-deck.pptx" };
    const TOTAL = D.total;
    let i = 1;

    const img = document.getElementById('slide');
    const cur = document.getElementById('cur');
    document.getElementById('total').textContent = TOTAL;
    document.getElementById('deckTitle').innerHTML = D.title + ' <span>— ' + D.subtitle + '</span>';
    document.getElementById('dl').href = './' + D.file;
    document.title = D.title + ' — ' + D.subtitle;
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const V = '2026-06-10a'; // cache-buster: /slides/* is served with a 1-yr immutable cache
    const src = n => `./slides/Slide${n}.JPG?v=${V}`;

    function show(n) {
      i = Math.max(1, Math.min(TOTAL, n));
      img.src = src(i);
      cur.textContent = i;
      prevBtn.disabled = i === 1;
      nextBtn.disabled = i === TOTAL;
      history.replaceState(null, '', `#${i}`);
      renderNotes();
      document.querySelectorAll('.thumb').forEach((t, k) => t.classList.toggle('current', k + 1 === i));
    }

    // --- Notes / presenter mode ---
    function renderNotes() {
      document.getElementById('notesNum').textContent = 'Slide ' + i + ' of ' + TOTAL;
      document.getElementById('notesTitle').textContent = (D.titles[i - 1] || '');
      document.getElementById('notesBody').textContent = (D.notes[i - 1] || 'No notes for this slide.');
      const nt = document.getElementById('nextThumb');
      if (i < TOTAL) { nt.src = src(i + 1); nt.style.display = ''; }
      else { nt.style.display = 'none'; }
    }
    function toggleNotes() { document.body.classList.toggle('notes-open'); }
    document.getElementById('notesBtn').addEventListener('click', toggleNotes);

    // --- Jump-to grid ---
    const overlay = document.getElementById('gridOverlay');
    function buildGrid() {
      const body = document.getElementById('gridBody');
      body.innerHTML = '';
      let grid = null;
      for (let n = 1; n <= TOTAL; n++) {
        const sec = (D.sections || []).find(s2 => s2.start === n);
        if (sec || !grid) {
          if (sec) {
            const lab = document.createElement('div');
            lab.className = 'section-label';
            lab.textContent = sec.label;
            body.appendChild(lab);
          }
          grid = document.createElement('div');
          grid.className = 'grid';
          body.appendChild(grid);
        }
        const t = document.createElement('div');
        t.className = 'thumb' + (n === i ? ' current' : '');
        t.innerHTML = `<img loading="lazy" src="${src(n)}" alt="Slide ${n}"><div class="cap"><b>${n}.</b> ${(D.titles[n-1] || '')}</div>`;
        t.addEventListener('click', () => { show(n); closeGrid(); });
        grid.appendChild(t);
      }
    }
    function openGrid() { buildGrid(); overlay.classList.add('open'); }
    function closeGrid() { overlay.classList.remove('open'); }
    function toggleGrid() { overlay.classList.contains('open') ? closeGrid() : openGrid(); }
    document.getElementById('gridBtn').addEventListener('click', toggleGrid);
    document.getElementById('gridClose').addEventListener('click', closeGrid);
    document.getElementById('counter').addEventListener('click', toggleGrid);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeGrid(); });

    // --- Navigation ---
    prevBtn.addEventListener('click', () => show(i - 1));
    nextBtn.addEventListener('click', () => show(i + 1));

    document.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === 'escape') { closeGrid(); return; }
      if (k === 'g') { toggleGrid(); e.preventDefault(); return; }
      if (k === 'n') { toggleNotes(); e.preventDefault(); return; }
      if (overlay.classList.contains('open')) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || k === 'j') { show(i + 1); e.preventDefault(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || k === 'k') { show(i - 1); e.preventDefault(); }
      else if (e.key === 'Home') { show(1); e.preventDefault(); }
      else if (e.key === 'End') { show(TOTAL); e.preventDefault(); }
      else if (/^[1-9]$/.test(e.key)) { show(parseInt(e.key, 10)); }
    });

    let touchX = null;
    document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });

    const fromHash = parseInt((location.hash || '').slice(1), 10);
    show(Number.isFinite(fromHash) && fromHash >= 1 ? fromHash : 1);

    for (let n = 1; n <= TOTAL; n++) { const pre = new Image(); pre.src = src(n); }
  </script>
</body>
</html>
